name = "stowgui-license"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://stowgui.com"
EMAIL_FROM = "StowGUI <license@stowgui.com>"
DOWNLOAD_URL = "https://stowgui.com/en/download/"
# Optional: only handle purchases from this Payment Link (plink_...)
STRIPE_PAYMENT_LINK_ID = ""

[[d1_databases]]
binding = "DB"
database_name = "stowgui-licenses"
database_id = "f45f002f-53ca-424c-8d5a-5f19a501bf74"
migrations_dir = "migrations"

# Secrets (wrangler secret put …): STRIPE_WEBHOOK_SECRET, LICENSE_SIGNING_KEY, RESEND_API_KEY
